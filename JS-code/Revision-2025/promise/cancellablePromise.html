<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<title>Cancellable Promise</title>
</head>

<body>
	<button id="startBtn">Start Promise</button>
	<button id="cancelBtn">Cancel Promise</button>

	<script>
		const startBtn = document.getElementById("startBtn");
		const cancelBtn = document.getElementById("cancelBtn");

		let controller = null; // store current controller

		function startFn() {
			// Create a new controller per start
			controller = new AbortController();
			const signal = controller.signal;

			function cancellablePromise(signal) {
				return new Promise((resolve, reject) => {
					const id = setTimeout(() => {
						resolve("Event triggered");
					}, 10_000);

					signal.addEventListener("abort", () => {
						clearTimeout(id);
						reject("Event cancelled");
					});
				});
			}

			console.log("Function started");

			cancellablePromise(signal).then(console.log).catch(console.log);
		}

		function cancelFn() {
			if (controller) {
				controller.abort();
				controller = null;
			}
		}

		startBtn.addEventListener("click", startFn);
		cancelBtn.addEventListener("click", cancelFn);
	</script>
</body>

</html>
